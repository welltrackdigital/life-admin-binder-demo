<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Life Admin Binder 2027 — Free Demo</title>
<meta name="theme-color" content="#5E4075">
<style>
:root{--navy:#5E4075;--indigo:#76589A;--blue:#9A80B8;--peri:#C4B0EA;--steel:#D8C8FA;--snow:#EEE5FF;
--bg:#F9F6FF;--paper:#FFFFFF;--ink:#2E1F3A;--ink2:#6E5E80;--line:#E8DEF7;--bad:#C2546A;--warn:#C88A2E;--ok:#3E8E7E;
--r:16px;--sh:0 1px 2px rgba(94,64,117,.06),0 8px 24px rgba(94,64,117,.07);--serif:"Fraunces","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--sans:Inter,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
*{box-sizing:border-box}html,body{margin:0}body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
input,select,textarea{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;outline:none;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--navy)}
svg{display:block}
.app{display:flex;min-height:100vh}
/* sidebar */
#side{width:256px;flex:0 0 256px;background:var(--navy);color:#EEE5FF;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{display:flex;gap:12px;align-items:center;padding:18px 16px 14px}
.brand img{width:46px;height:46px;border-radius:13px}
.brand b{display:block;font-family:var(--serif);font-size:19px;font-weight:600;color:#fff;line-height:1.1}.brand span{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--peri)}
.navqa{padding:0 14px 10px}.navqa button{width:100%;border:0;border-radius:12px;background:var(--steel);color:var(--navy);font-weight:700;padding:10px}
#nav{flex:1;overflow-y:auto;padding:0 10px 14px;scrollbar-width:thin;scrollbar-color:var(--indigo) transparent}
.ngrp{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--peri);opacity:.8;margin:14px 10px 6px}
#nav button.nv{display:flex;gap:11px;align-items:flex-start;width:100%;border:0;background:none;color:#EFE6FA;text-align:left;padding:8px 10px;border-radius:12px;margin:1px 0}
#nav button.nv:hover{background:rgba(255,255,255,.07)}#nav button.nv.on{background:var(--indigo);color:#fff}
.nv .ic{width:30px;height:30px;flex:0 0 30px;border-radius:9px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center}
.nv.on .ic{background:var(--peri);color:var(--navy)}
.ic svg{width:17px;height:17px}
.nv .nt{display:flex;flex-direction:column;min-width:0}.nv .nt b{font-weight:600;font-size:13.5px;line-height:1.25}.nv .nt small{font-size:10.5px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
.nv .cnt{margin-left:auto;align-self:center;background:var(--bad);color:#fff;font-size:10px;font-weight:700;border-radius:999px;padding:2px 7px}
.me{display:flex;gap:10px;align-items:center;padding:12px 16px;border-top:1px solid rgba(255,255,255,.1);font-size:12px}
.me .av{width:32px;height:32px;border-radius:50%;background:var(--peri);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:700}
/* main */
#main{flex:1;min-width:0;padding:0 26px 40px}
.wrap{max-width:1240px;margin:0 auto}
header.top{display:flex;align-items:center;gap:10px;padding:16px 0;position:sticky;top:0;background:var(--bg);z-index:30}
.ham{display:none;border:0;background:var(--paper);border-radius:12px;width:40px;height:40px;align-items:center;justify-content:center;box-shadow:var(--sh)}
.ttl{min-width:0;flex:0 1 auto}.ttl h1{font-family:var(--serif);font-weight:600;font-size:24px;margin:0;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ttl p{margin:0;color:var(--ink2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
.search{position:relative;width:230px}.search input{padding-left:34px;background:var(--paper);height:40px}.search svg{position:absolute;left:11px;top:12px;width:16px;height:16px;color:var(--ink2)}
.chip{display:flex;align-items:center;gap:8px;border:1.5px dashed var(--peri);background:var(--snow);border-radius:999px;padding:4px 5px 4px 13px;font-size:12.5px;white-space:nowrap}
.chip b{color:var(--navy)}.chip button{border:0;background:var(--navy);color:#fff;border-radius:999px;padding:6px 13px;font-weight:700;font-size:12px}
.ib{width:40px;height:40px;flex:0 0 40px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);color:var(--navy);display:flex;align-items:center;justify-content:center;position:relative}
.ib svg{width:18px;height:18px}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;background:var(--navy);color:#fff;white-space:nowrap}
.btn.soft{background:var(--snow);color:var(--navy);border:1.5px solid var(--steel)}.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:10px}
.btn.ghost{background:none;color:var(--ink2);border:1.5px solid var(--line)}
#bellN{position:absolute;top:-6px;right:-6px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;border-radius:999px;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;padding:0 4px}
#bellP{display:none;position:absolute;right:0;top:48px;width:340px;max-width:88vw;background:#fff;border:1.5px solid var(--line);border-radius:16px;box-shadow:0 18px 50px rgba(94,64,117,.2);padding:14px;z-index:60}#bellP.on{display:block}
/* cards */
.card{background:var(--paper);border-radius:var(--r);box-shadow:var(--sh);padding:18px;min-width:0}
.k{font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--blue);font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.k .r{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:600;color:var(--ink2)}
.g{display:grid;gap:16px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g32{grid-template-columns:3fr 2fr}
.stat b{display:block;font-family:var(--serif);font-size:28px;color:var(--navy);font-weight:600;line-height:1.1}.stat span{font-size:12px;color:var(--ink2)}
.stat{display:flex;gap:14px;align-items:center}.stat .si{width:44px;height:44px;border-radius:13px;background:var(--snow);color:var(--navy);display:flex;align-items:center;justify-content:center;flex:0 0 44px}.stat .si svg{width:22px;height:22px}
.stat.bad .si{background:#F8E3E8;color:var(--bad)}
.mut{color:var(--ink2)}.small{font-size:12px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:700;white-space:nowrap}
.p-bad{background:#F8E3E8;color:var(--bad)}.p-warn{background:#FBEFD9;color:#9A6516}.p-ok{background:#E1F1EC;color:var(--ok)}.p-info{background:var(--snow);color:var(--indigo)}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}
.row .dt{width:46px;flex:0 0 46px;text-align:center;border-radius:11px;background:var(--snow);padding:5px 0;color:var(--navy)}.row .dt b{display:block;font-size:17px;line-height:1}.row .dt span{font-size:9.5px;letter-spacing:1px;text-transform:uppercase}
.row .mn{flex:1;min-width:0}.row .mn b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .mn span{font-size:11.5px;color:var(--ink2)}
.sec-dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.empty{padding:22px;text-align:center;color:var(--ink2);font-size:13px}
.empty svg{width:42px;height:42px;margin:0 auto 8px;color:var(--peri)}
/* hero binder */
.hero{display:grid;grid-template-columns:1.35fr 1fr;gap:18px;margin-bottom:18px}
.binderwrap{background:var(--snow);border-radius:22px;padding:26px 22px 26px 26px;position:relative;min-height:400px;overflow:hidden}
.binderwrap .deco1{position:absolute;right:-30px;bottom:-40px;width:180px;height:180px;border-radius:50%;background:var(--steel);opacity:.55}
.binderwrap .deco2{position:absolute;left:-40px;top:-50px;width:150px;height:150px;border-radius:50%;background:var(--steel);opacity:.4}
.binder{position:relative;display:flex;height:100%;min-height:348px;filter:drop-shadow(0 18px 26px rgba(94,64,117,.22))}
.bcover{width:34%;background:var(--navy);border-radius:18px 0 0 18px;padding:26px 22px;color:#fff;display:flex;flex-direction:column;position:relative}
.bcover .lbl{background:var(--snow);color:var(--navy);border-radius:10px;padding:12px;text-align:center;margin-top:auto}
.bcover .lbl b{display:block;font-family:var(--serif);font-size:20px;line-height:1.1}.bcover .lbl span{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--indigo)}
.bcover .elastic{position:absolute;right:16px;top:0;bottom:0;width:7px;background:var(--indigo)}
.bcover .hi{font-size:12px;color:var(--peri)}.bcover .nm{font-family:var(--serif);font-size:24px;line-height:1.15;margin-top:4px}
.rings{position:absolute;right:-16px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:space-around;padding:40px 0;z-index:3}
.rings i{width:28px;height:13px;border-radius:8px;border:4px solid #D9CCEB;background:transparent;display:block}
.bpage{flex:1;min-width:0;background:#fff;border-radius:0 18px 18px 0;padding:24px 26px 20px 30px;position:relative;background-image:repeating-linear-gradient(transparent 0 31px,#F3EDFC 31px 32px);background-position:0 72px}
.bpage h2{font-family:var(--serif);color:var(--navy);margin:0 0 4px;font-size:22px;font-weight:600}
.bpage .sub{font-size:12px;color:var(--ink2);margin-bottom:12px}
.bpage .row{border-bottom:1px dashed var(--line);padding:7px 0}
.tabs{display:flex;flex-direction:column;gap:4px;padding:14px 0;width:46px;flex:0 0 46px;margin-left:-2px}
.tabs button{flex:1;width:46px;border:0;border-radius:0 12px 12px 0;color:#fff;font-size:10.5px;font-weight:700;writing-mode:vertical-rl;padding:6px 0;transition:transform .2s;letter-spacing:.4px;text-align:center}
.tabs button:hover{transform:translateX(7px)}
.ministat{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.score{display:flex;align-items:center;gap:16px}
.ring{width:96px;height:96px;flex:0 0 96px;position:relative}.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:24px;color:var(--navy)}
/* section page */
.banner{background:var(--navy);color:#fff;border-radius:20px;padding:24px 26px;display:flex;align-items:center;gap:22px;margin-bottom:16px;position:relative;overflow:hidden}
.banner .bi{width:74px;height:74px;border-radius:20px;background:var(--indigo);display:flex;align-items:center;justify-content:center;flex:0 0 74px;color:var(--steel)}.banner .bi svg{width:38px;height:38px}
.banner h2{font-family:var(--serif);font-weight:600;font-size:28px;margin:0}.banner p{margin:4px 0 0;color:var(--steel);font-size:13px;max-width:560px}
.banner .bc1{position:absolute;right:-50px;top:-60px;width:220px;height:220px;border-radius:50%;background:var(--indigo);opacity:.6}
.banner .bc2{position:absolute;right:120px;bottom:-90px;width:160px;height:160px;border-radius:50%;background:var(--blue);opacity:.35}
.banner .bk{font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--peri);font-weight:700}
.banner>div{position:relative;z-index:1}
.form{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));align-items:end}
.form label{display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:700;color:var(--ink2);letter-spacing:.3px}
.form label.ck{flex-direction:row;align-items:center;gap:8px;height:40px}
.tbl{width:100%;border-collapse:collapse}.tbl th{text-align:left;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--blue);padding:8px 10px;border-bottom:1.5px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}.tbl tr:hover td{background:#FBF8FF}
.tbl td.t b{color:var(--navy)}.acts{display:flex;gap:6px;justify-content:flex-end}
.acts button{border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:5px 9px;font-size:12px;font-weight:600;color:var(--navy);white-space:nowrap}
.acts button.done{background:var(--navy);color:#fff;border-color:var(--navy)}
.tscroll{overflow-x:auto}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.toolbar input{max-width:240px;height:38px}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:600;color:var(--ink2)}.seg button.on{background:var(--navy);border-color:var(--navy);color:#fff}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal .h{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--blue);font-weight:700;text-align:center;padding:4px}
.cal .d{background:#fff;border:1.5px solid var(--line);border-radius:12px;min-height:96px;padding:6px;overflow:hidden}.cal .d.o{opacity:.4}.cal .d.t{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}
.cal .d .n{font-size:12px;font-weight:700;color:var(--navy)}.cal .ev{display:block;font-size:10.5px;border-radius:6px;padding:2px 5px;margin-top:3px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:0;width:100%;text-align:left}
.mrib{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.mrib button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:6px 11px;font-size:12px;font-weight:600;color:var(--ink2)}.mrib button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
/* checklist */
.chk{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}.chk.on span{text-decoration:line-through;color:var(--ink2)}
.bar{height:8px;border-radius:9px;background:var(--snow);overflow:hidden}.bar i{display:block;height:100%;background:var(--navy);border-radius:9px}
/* emergency sheet */
.sheet{background:#fff;border:2px solid var(--navy);border-radius:18px;padding:22px}
.sheet h3{font-family:var(--serif);color:var(--navy);margin:0 0 4px;font-size:22px}
.sheet .sbx{border:1.5px solid var(--line);border-radius:12px;padding:12px}
/* modal */
#mw{position:fixed;inset:0;background:rgba(46,31,58,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}#mw.on{display:flex}
#mb{background:#fff;border-radius:20px;max-width:620px;width:100%;max-height:90vh;overflow:auto;padding:22px;box-shadow:0 30px 80px rgba(46,31,58,.35)}
#mb h3{font-family:var(--serif);color:var(--navy);margin:0 0 4px;font-size:22px}
.mfoot{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
#toast{opacity:0;position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;font-size:13px;z-index:120;transition:transform .3s}#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.qsec{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}.qsec button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px;display:flex;gap:8px;align-items:center;font-size:12.5px;font-weight:600;color:var(--navy);text-align:left}
.qsec button .ic{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--snow)}
.hubgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.hub{border:0;background:#fff;border-radius:16px;box-shadow:var(--sh);padding:16px;text-align:left;display:flex;flex-direction:column;gap:10px;transition:transform .2s}
.hub:hover{transform:translateY(-3px)}.hub .ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff}.hub .ic svg{width:20px;height:20px}
.hub b{color:var(--navy);font-size:14px}.hub span{font-size:11.5px;color:var(--ink2)}
.welcome{position:fixed;inset:0;background:var(--navy);z-index:150;display:flex;align-items:center;justify-content:center;padding:20px}
.welcome .wb{background:#fff;border-radius:24px;max-width:460px;width:100%;padding:30px;text-align:center}
.welcome img{width:84px;height:84px;border-radius:22px}.welcome h2{font-family:var(--serif);color:var(--navy);font-size:30px;margin:14px 0 6px}
#scrim{display:none}
@media(max-width:1500px){.chip span{display:none}}
@media(max-width:1200px){.search{display:none}}
@media(max-width:1440px){.hero{grid-template-columns:1fr}.hero>.g{grid-template-columns:1fr 1fr}}
@media(max-width:1080px){.hero>.g{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}.g32{grid-template-columns:1fr}}
@media(max-width:860px){
 #side{position:fixed;left:0;top:0;bottom:0;z-index:90;transform:translateX(-105%);transition:transform .25s}
 #side.open{transform:none}#scrim.on{display:block;position:fixed;inset:0;background:rgba(46,31,58,.4);z-index:80}
 .ham{display:flex}.tb-qa{font-size:0!important;padding:10px 14px!important}.tb-qa:after{content:'＋';font-size:17px}.sp{display:none}.ttl{flex:1}.ttl h1{text-overflow:clip!important;white-space:normal!important;font-size:18px!important;line-height:1.15}.ttl p{display:none}#main{padding:0 14px 30px}.chip{display:none}.tb-print{display:none!important}
 .g2,.g3{grid-template-columns:1fr}.ttl h1{font-size:20px}
 .binderwrap{padding:16px 16px 16px 16px;min-height:0}.binder{flex-direction:column;min-height:0}
 .bcover{width:auto;border-radius:16px 16px 0 0;padding:18px;flex-direction:row;align-items:center;gap:14px}.bcover .lbl{margin:0 0 0 auto;padding:8px 10px}.bcover .lbl b{font-size:15px}.bcover .elastic,.rings{display:none}
 .bpage{border-radius:0 0 16px 16px;padding:16px}
 .tabs{flex-direction:row;flex-wrap:wrap;margin:12px 0 0;gap:6px;width:auto;flex:none;padding:0}.tabs button{writing-mode:horizontal-tb;width:auto;flex:0 0 auto;border-radius:999px;padding:7px 12px}
 .banner{padding:18px;gap:14px}.banner .bi{width:54px;height:54px;flex-basis:54px}.banner h2{font-size:22px}
 .cal{gap:3px}.cal .d{min-height:62px;padding:4px;border-radius:8px}.cal .ev{font-size:0;height:6px;padding:0}.cal .h{font-size:9px}
 .tbl .hm{display:none}
}
@media print{.sheet .g2{grid-template-columns:1fr 1fr!important}.sheet .row{padding:5px 0}#side,header.top,.no-print,#toast,.toolbar,.acts,.form,.ham{display:none!important}#main{padding:0}body{background:#fff}.card{box-shadow:none;border:1px solid var(--line)}.banner{background:#fff;color:var(--navy);border:2px solid var(--navy)}}
.bk2{font-size:11px;letter-spacing:2px;color:var(--blue);font-weight:700}
.hero2{display:grid;grid-template-columns:1.1fr 1fr;gap:10px;align-items:center;background:var(--paper);border-radius:26px;box-shadow:var(--sh);padding:30px 30px 30px 40px;margin-bottom:18px}
.htext h2{font-family:var(--serif);font-weight:600;color:var(--navy);font-size:36px;line-height:1.15;margin:10px 0 12px}
.htext p{font-size:15px;color:var(--ink2);margin:0 0 20px;line-height:1.5}.htext p b{color:var(--navy)}
.hbtns{display:flex;gap:10px;flex-wrap:wrap}.hbtns .btn{padding:13px 22px;font-size:14.5px}
.hart svg{width:100%;height:auto;border-radius:22px}
.hubs2{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:18px}
.hub2{border:0;background:var(--paper);border-radius:22px;box-shadow:var(--sh);padding:16px 16px 18px;text-align:left;display:flex;flex-direction:column;gap:4px;transition:transform .2s,box-shadow .2s}
.hub2:hover{transform:translateY(-4px);box-shadow:0 16px 34px rgba(94,64,117,.14)}
.hart2 svg{width:100%;height:auto;margin-bottom:6px}
.hub2 b{font-family:var(--serif);font-size:20px;color:var(--navy);font-weight:600}.hub2 span{font-size:12.5px;color:var(--ink2)}
.hub2 em{font-style:normal;font-size:11.5px;font-weight:700;color:var(--ok);background:#E1F1EC;border-radius:999px;padding:4px 10px;align-self:flex-start;margin-top:8px}
.hub2 em.att{color:#9A6516;background:#FBEFD9}
.tlist{display:flex;flex-direction:column;gap:8px}
.tcard{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--bg);border:1.5px solid transparent}
.tcard.late{background:#FBF1F3;border-color:#F3D6DD}
.tic{width:40px;height:40px;flex:0 0 40px;border-radius:12px;color:#fff;display:flex;align-items:center;justify-content:center}.tic svg{width:19px;height:19px}
.tcard .mn,.icard .mn{flex:1;min-width:0}.tcard .mn b,.icard .mn b{display:block;font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tcard .mn span,.icard .mn span{font-size:12px;color:var(--ink2)}
.tcard.late .mn span{color:var(--bad);font-weight:600}
.addline{display:flex;gap:8px;margin-top:10px}
.mini2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.mini2>div{display:flex;flex-direction:column;gap:2px}.big{font-family:var(--serif);font-size:28px;color:var(--navy);font-weight:600}
.mini2 a{color:var(--indigo);font-weight:600}
.hbanner{display:grid;grid-template-columns:1.4fr 1fr;align-items:center;background:var(--paper);border-radius:26px;box-shadow:var(--sh);padding:26px 30px;margin-bottom:16px;gap:10px}
.hbanner h2{font-family:var(--serif);font-weight:600;color:var(--navy);font-size:34px;margin:6px 0 8px}.hbanner p{color:var(--ink2);margin:0 0 16px;font-size:14px;max-width:520px;line-height:1.5}
.hart3 svg{width:100%;max-width:280px;height:auto;margin-left:auto}
.hstats{display:flex;gap:10px;flex-wrap:wrap}.hstats span{background:var(--snow);border-radius:14px;padding:10px 14px;color:var(--navy)}.hstats b{font-family:var(--serif);font-size:20px}.hstats small{font-size:12px;color:var(--ink2);font-family:var(--sans);font-weight:500}
.hstats span.att{background:#FBEFD9}
.hbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.icard{background:var(--paper);border-radius:20px;box-shadow:var(--sh);padding:16px;display:flex;flex-direction:column;gap:10px}
.itop{display:flex;gap:12px;align-items:center}.amt{font-family:var(--serif);color:var(--navy);font-size:18px}
.idet{font-size:12.5px;color:var(--ink2);background:var(--bg);border-radius:10px;padding:8px 10px}
.ibot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.idate{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--navy);font-weight:600}.idate svg{width:14px;height:14px}
.ibot .sp{flex:1}
.ib.sm{width:34px;height:34px;flex-basis:34px;border-radius:10px}.ib.sm svg{width:15px;height:15px}
.nv.sm .ic{width:26px;height:26px;flex-basis:26px}
.card.empty svg{width:220px;height:auto;margin:0 auto}
@media(max-width:1300px){.hubs2{grid-template-columns:repeat(3,1fr)}}
@media(max-width:1000px){.hero2,.hbanner{grid-template-columns:1fr}.hart,.hart3{order:-1}.hart3 svg{margin:0 auto;max-width:220px}}
@media(max-width:860px){.hero2{padding:18px}.htext h2{font-size:26px}.hubs2{grid-template-columns:1fr 1fr;gap:10px}.hub2{padding:12px;border-radius:18px}.hub2 b{font-size:17px}.hub2 span{font-size:11.5px}.hbanner{padding:18px}.hbanner h2{font-size:26px}.igrid{grid-template-columns:1fr}.mini2{grid-template-columns:1fr 1fr}.hub2:last-child{grid-column:span 2}.dbr{display:none}}

html[data-theme=dark]{--bg:#1C1424;--paper:#281D33;--ink:#F3ECFC;--ink2:#BCA9D2;--line:#3B2C4B;--snow:#33253F;--steel:#4A3760;--peri:#C4B0EA;--navy:#B497DA;--indigo:#8E6FB3;--sh:0 1px 2px rgba(0,0,0,.3),0 10px 26px rgba(0,0,0,.28)}
html[data-theme=dark] body{background:var(--bg)}html[data-theme=dark] .nv.on .ic,html[data-theme=dark] .me .av{background:#EEE5FF;color:#5E4075}
html[data-theme=dark] #side{background:#2A1C36}
html[data-theme=dark] #nav button.nv.on{background:#5E4075}
html[data-theme=dark] .navqa button{background:#5E4075;color:#F3ECFC}
html[data-theme=dark] .btn{background:#8E6FB3;color:#fff}html[data-theme=dark] .btn.soft{background:var(--snow);color:#E6D9F7;border-color:var(--line)}html[data-theme=dark] .btn.ghost{background:none;color:var(--ink2)}
html[data-theme=dark] input,html[data-theme=dark] select,html[data-theme=dark] textarea{background:#221830;color:var(--ink);border-color:var(--line)}
html[data-theme=dark] .ib,html[data-theme=dark] .acts button,html[data-theme=dark] .seg button,html[data-theme=dark] .mrib button,html[data-theme=dark] .cal .d,html[data-theme=dark] .qsec button,html[data-theme=dark] .hub,html[data-theme=dark] .sheet,html[data-theme=dark] #mb,html[data-theme=dark] #bellP{background:var(--paper);border-color:var(--line);color:var(--ink)}
html[data-theme=dark] .seg button.on,html[data-theme=dark] .mrib button.on{background:#8E6FB3;border-color:#8E6FB3;color:#fff}
html[data-theme=dark] .tic,html[data-theme=dark] .hub .ic{filter:brightness(1.15)}
html[data-theme=dark] .tcard.late{background:#3A2030;border-color:#5A2E42}
html[data-theme=dark] .p-bad{background:#4A2232;color:#F2A7B8}html[data-theme=dark] .p-warn{background:#47361B;color:#F0C987}html[data-theme=dark] .p-ok{background:#1E3B35;color:#8FD3C1}html[data-theme=dark] .p-info{background:var(--snow);color:var(--peri)}
html[data-theme=dark] .hub2 em{background:#1E3B35;color:#8FD3C1}html[data-theme=dark] .hub2 em.att{background:#47361B;color:#F0C987}html[data-theme=dark] .hstats span.att{background:#47361B}
html[data-theme=dark] .stat.bad .si{background:#4A2232}
html[data-theme=dark] .hart svg,html[data-theme=dark] .hart2 svg,html[data-theme=dark] .hart3 svg,html[data-theme=dark] .card.empty svg{filter:brightness(.9) saturate(.95)}
html[data-theme=dark] .tbl tr:hover td{background:#2F2240}
html[data-theme=dark] .chip{background:var(--snow);border-color:var(--line)}html[data-theme=dark] .chip button{background:#8E6FB3}
html[data-theme=dark] .cal .ev{filter:brightness(1.2)}
html[data-theme=dark] #toast{background:#8E6FB3}
.thseg{display:flex;gap:8px}.thseg button{flex:1;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:12px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}.thseg button.on{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}.thseg svg{width:16px;height:16px}
.ibot{display:flex;flex-wrap:nowrap;align-items:center;gap:8px}.ileft{display:flex;flex-wrap:wrap;align-items:center;gap:6px;flex:1;min-width:0}.ibtns{display:flex;gap:6px;flex:0 0 auto}
#bellP .grp{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--blue);font-weight:700;margin:10px 0 2px}
#bellP{max-height:72vh;overflow:auto}

#dBar{position:sticky;top:0;z-index:95;display:flex;align-items:center;justify-content:center;gap:12px;background:#5E4075;color:#F7F1FF;font-size:13px;padding:8px 14px;min-height:44px;flex-wrap:wrap}
#dBar b{letter-spacing:1.4px;font-size:11.5px}.dTrack{width:120px;height:7px;border-radius:9px;background:rgba(255,255,255,.22);overflow:hidden}.dTrack i{display:block;height:100%;width:0;background:#E1D2FF;transition:width .3s}
#dBar a{background:#E1D2FF;color:#5E4075;font-weight:700;border-radius:999px;padding:6px 14px;text-decoration:none}
#side{top:44px!important;height:calc(100vh - 44px)!important}header.top{top:44px!important}
#dWall{display:none;position:fixed;inset:0;z-index:200;background:rgba(46,31,58,.55);align-items:center;justify-content:center;padding:16px}#dWall.on{display:flex}
.dBox{background:#fff;border-radius:22px;max-width:440px;padding:28px;color:#2E1F3A;box-shadow:0 20px 60px rgba(46,31,58,.35)}
.dK{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:#76589A;font-weight:700}.dBox h3{font-family:var(--serif);color:#5E4075;font-size:22px;margin:8px 0 10px}.dBox p{font-size:14px;line-height:1.6;margin:0 0 18px}
.dBtns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}.dBtns button,.dBtns a{border-radius:12px;padding:10px 16px;font-weight:700;font-size:14px;text-decoration:none;cursor:pointer}.dBtns button{background:#EEE5FF;color:#5E4075;border:1.5px solid #E1D2FF}.dBtns a{background:#5E4075;color:#fff}
@media(max-width:860px){#side{top:0!important;height:100vh!important}header.top{top:44px!important}#dBar .dt{display:none}.dTrack{width:70px}#dBar{font-size:11.5px;gap:8px}}

/* status of an item */
function itemDate(s,it){return s.date?it[s.date]:null}
function status(s,it){if(s.id==='todo'&&it.done)return['p-ok','Done'];if(s.id==='tax'&&it.status&&it.status!=='To do')return['p-ok',it.status];
 const d=days(itemDate(s,it));if(d==null)return s.date?['p-info','No date']:null;
 const soon=(s.id==='docs'||s.id==='inv'||s.id==='ins')?90:(s.id==='family'?30:14);
 if(d<0)return['p-bad',s.id==='docs'||s.id==='inv'?'Expired':'Overdue '+(-d)+'d'];if(d===0)return['p-warn','Today'];if(d<=soon)return['p-warn','In '+d+' day'+(d>1?'s':'')];return['p-ok','OK']}
function allDated(){const o=[];SEC.forEach(s=>{if(!s.date)return;S.items[s.id].forEach((it,i)=>{const v=itemDate(s,it);if(!v)return;if(s.id==='todo'&&it.done)return;if(s.id==='tax'&&it.status&&it.status!=='To do')return;o.push({s,it,i,date:v,d:days(v)})})});return o.sort((a,b)=>a.d-b.d)}
function reminders(){return allDated().filter(x=>x.d<=((x.s.id==='docs'||x.s.id==='inv')?90:7))}
function monthlyCost(id){return S.items[id].reduce((t,it)=>t+(+it.amt||0)*(FM[it.freq]||0),0)}

/* calendar */
function occ(s,it,y,m){const v=itemDate(s,it);if(!v)return[];const f=s.freq&&it[s.freq];const out=[];let d=pd(v);
 if(!f||f==='One-off'||!FM[f]){if(d.getFullYear()===y&&d.getMonth()===m)out.push(d.getDate());if(s.id==='family'&&(it.what==='Birthday'||it.what==='Anniversary')){out.length=0;if(d.getMonth()===m)out.push(d.getDate())}return out}
 let g=0;let x=new Date(d);while((x.getFullYear()<y||(x.getFullYear()===y&&x.getMonth()<=m))&&g<600){if(x.getFullYear()===y&&x.getMonth()===m)out.push(x.getDate());x=pd(addF(fd(x),f));g++}return out}
function calView(){const t=td();if(!calM)calM=[t.getFullYear(),t.getMonth()];const [y,m]=calM;const first=new Date(y,m,1);const st=(first.getDay()+6)%7;const dim=new Date(y,m+1,0).getDate();
 const ev={};SEC.forEach(s=>{if(!s.date)return;S.items[s.id].forEach((it,i)=>{if(s.id==='todo'&&it.done)return;occ(s,it,y,m).forEach(dd=>{(ev[dd]=ev[dd]||[]).push({s,it,i})})})});
 let cells='';for(let i=0;i<42;i++){const dn=i-st+1;if(i>=35&&dn>dim)break;const inm=dn>=1&&dn<=dim;const dt=new Date(y,m,dn);const isT=dt.getTime()===t.getTime();
  cells+='<div class="d'+(inm?'':' o')+(isT?' t':'')+'"><div class="n">'+dt.getDate()+'</div>'+(inm?(ev[dn]||[]).slice(0,4).map(e=>'<button class="ev" style="background:'+e.s.c+'" onclick="go(\''+e.s.id+'\')" title="'+esc(e.it[e.s.title])+'">'+esc(e.it[e.s.title])+'</button>').join('')+((ev[dn]||[]).length>4?'<span class="small mut">+'+((ev[dn].length)-4)+' more</span>':''):'')+'</div>'}
 const list=Object.keys(ev).sort((a,b)=>a-b).flatMap(dd=>ev[dd].map(e=>({...e,dd:+dd})));
 return '<div class="mrib">'+MS.map((n,i)=>'<button class="'+(i===m?'on':'')+'" onclick="calM=['+y+','+i+'];go(\'calendar\')">'+n+'</button>').join('')+'</div>'
 +'<div class="card" style="margin-bottom:16px"><div style="display:flex;align-items:center;gap:10px;margin-bottom:12px"><button class="btn soft sm" onclick="calM=['+(m?y:y-1)+','+(m?m-1:11)+'];go(\'calendar\')">‹ Prev</button><h2 style="font-family:var(--serif);color:var(--navy);margin:0;font-size:24px;flex:1;text-align:center">'+MF[m]+' '+y+'</h2><button class="btn soft sm" onclick="calM=['+(m<11?y:y+1)+','+(m<11?m+1:0)+'];go(\'calendar\')">Next ›</button></div>'
 +'<div class="cal">'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>'<div class="h">'+d+'</div>').join('')+cells+'</div></div>'
 +'<div class="card"><div class="k">Everything in '+MF[m]+'<span class="r">'+list.length+' dates</span></div>'+(list.map(e=>'<div class="row"><div class="dt"><b>'+e.dd+'</b><span>'+MS[m]+'</span></div><div class="mn"><b>'+esc(e.it[e.s.title])+(e.s.amt&&e.it[e.s.amt]?' · '+money(e.it[e.s.amt]):'')+'</b><span><i class="sec-dot" style="background:'+e.s.c+'"></i> '+e.s.name+'</span></div></div>').join('')||'<div class="empty">Nothing this month.</div>')+'</div>'}
/* weekly reset */
function wkKey(){const d=td();const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return fd(d)}
function resetItems(){return S.resetList||['Check bank and card balances','Pay or schedule bills due this week','Open and sort the post / email inbox','File receipts and paperwork','Review the calendar for the next 2 weeks','Check subscriptions renewing soon','Reply to forms and school notes','Update the grocery and errands list','Back up your binder (Settings)','Plan one home-maintenance job']}
function resetView(){const L=resetItems();const k=wkKey();const done=L.filter(r=>S.reset[k+'|'+r]).length;const p=Math.round(done/L.length*100);const w=pd(k);

 +'<div class="g g2"><div class="card"><div class="k">Week of '+w.getDate()+' '+MS[w.getMonth()]+'<span class="r">'+done+' / '+L.length+'</span></div><div class="bar" style="margin-bottom:10px"><i style="width:'+p+'%"></i></div>'
 +L.map((r,i)=>'<label class="chk'+(S.reset[k+'|'+r]?' on':'')+'"><input type="checkbox"'+(S.reset[k+'|'+r]?' checked':'')+' onchange="S.reset[\''+k+'|\'+resetItems()['+i+']]=this.checked;save();go(\'reset\')"><span>'+esc(r)+'</span></label>').join('')
 +'<div class="form" style="margin-top:12px;grid-template-columns:1fr auto"><input id="rsNew" placeholder="Add your own step…"><button class="btn" onclick="const v=$(\'#rsNew\').value.trim();if(v){S.resetList=resetItems().concat(v);save();go(\'reset\')}">＋ Add</button></div></div>'
 +'<div class="g" style="align-content:start"><div class="card"><div class="k">This week’s reset</div><div class="score"><div class="ring">'+ringSVG(p)+'<b>'+p+'%</b></div><div><b style="color:var(--navy)">'+(p===100?'Reset complete ✦':'Keep going')+'</b><p class="small mut">Due in the next 7 days: '+allDated().filter(x=>x.d>=0&&x.d<=7).length+' items · overdue: '+allDated().filter(x=>x.d<0).length+'</p></div></div></div>'
 +'<div class="card"><div class="k">Needs you this week</div>'+(allDated().filter(x=>x.d<=7).slice(0,6).map(x=>rowHTML(x)).join('')||'<div class="empty">All clear ✦</div>')+'</div></div></div>'}
